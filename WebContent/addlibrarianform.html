<div class="page"><div class="card form-card"><h2>Add a librarian</h2><p class="muted">Create a secure librarian account.</p><form action="AddLibrarian" method="post"><div class="form-group"><label>Name</label><input class="form-control" name="name" maxlength="100" required></div><div class="form-group"><label>Email</label><input class="form-control" type="email" name="email" maxlength="150" required></div><div class="form-group"><label>Password</label><input class="form-control" type="password" name="password" minlength="8" autocomplete="new-password" required></div><div class="form-group"><label>Mobile</label><input class="form-control" type="tel" name="mobile" pattern="[0-9]{10}" maxlength="10" required></div><button class="btn btn-primary">Create librarian</button></form></div></div>
