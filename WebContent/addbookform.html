<div class="page"><div class="card form-card"><h2>Add a book</h2><p class="muted">Add a title to the library inventory.</p><form action="AddBook" method="post"><div class="form-group"><label>Call number</label><input class="form-control" name="callno" maxlength="100" required></div><div class="form-group"><label>Book name</label><input class="form-control" name="name" maxlength="200" required></div><div class="form-group"><label>Author</label><input class="form-control" name="author" maxlength="200" required></div><div class="form-group"><label>Publisher</label><input class="form-control" name="publisher" maxlength="200" required></div><div class="form-group"><label>Quantity</label><input class="form-control" type="number" name="quantity" min="1" max="100000" required></div><button class="btn btn-primary">Save book</button></form></div></div>
